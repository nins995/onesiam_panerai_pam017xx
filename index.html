    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const links = document.querySelectorAll('a[href^="#"]');

        links.forEach((link) => {
          link.addEventListener("click", function (e) {
            const targetId = this.getAttribute("href");
            const target = document.querySelector(targetId);

            if (target) {
              e.preventDefault();
              target.scrollIntoView({ behavior: "smooth", block: "start" });
            }
          });
        });

        const sectionSubmitted = document.getElementById("section-submitted");

        function handleFormSubmit(e) {
          e.preventDefault();

          sectionSubmitted.classList.remove("d-none");

          setTimeout(() => {
            sectionSubmitted.scrollIntoView({
              behavior: "smooth",
              block: "start",
            });
          }, 100);
        }

        // Every form on the page goes to the thank-you section
        document.querySelectorAll("form.form-content").forEach((form) => {
          form.addEventListener("submit", handleFormSubmit);
        });

        const BG_FADE_MS = 600; // keep in sync with .bg-fade-layer transition in newstyle.css

        function whenLoaded(img, cb) {
          if (img.complete) return cb();
          img.addEventListener("load", cb, { once: true });
          img.addEventListener("error", cb, { once: true });
        }

        // --- Product Slider — arrow controls, swipe-enabled, no auto-advance, no loop ---
        function initProductSlider({
          sliderId,
          arrowLeftId,
          arrowRightId,
          bgImgId,
          bgImages = [],
          bgMobileSourceId,
          bgMobileImages = [],
          bgFade = false,
          bgFadeMobile = false,
          titleId,
          mouseDrag = true,
        }) {
          const sliderEl = document.getElementById(sliderId);
          if (!sliderEl) return;
          const track = sliderEl.querySelector(".slider-track-inner");
          const slides = sliderEl.querySelectorAll(".slide");
          const slideCount = slides.length;
          const arrowLeft = document.getElementById(arrowLeftId);
          const arrowRight = document.getElementById(arrowRightId);
          const bgImg = document.getElementById(bgImgId);
          const bgMobileSource = document.getElementById(bgMobileSourceId);
          const titleEl = document.getElementById(titleId);
          const titles = titleEl ? titleEl.querySelectorAll("img") : [];
          const sectionEl = sliderEl.closest(".page-section");
          const mobileQuery = window.matchMedia("(max-width: 1023px)");
          let fadeLayer = null;
          let current = 0;
          let trackBusyUntil = 0; // slide transform (0.5s) still running until then

          // Preload so switching bg doesn't flash
          [...bgImages, ...bgMobileImages].forEach((src) => {
            new Image().src = src;
          });
          let trackWidth = sliderEl.offsetWidth;

          function setTransform(offsetPercent, animate = true) {
            track.style.transition = animate ? "transform 0.5s ease" : "none";
            track.style.transform = `translateX(${offsetPercent}%)`;
          }

          function updateArrows() {
            arrowLeft.style.visibility = current === 0 ? "hidden" : "visible";
            arrowRight.style.visibility = current === slideCount - 1 ? "hidden" : "visible";
          }


          function setDesktopBg(src) {
            if (src && bgImg) bgImg.src = src;
          }

          // Mobile bg: the <picture> <source> + the blurred top/bottom strips (--bg-mobile)
          function setMobileBg(src) {
            if (!src || !bgMobileSource) return;
            bgMobileSource.srcset = src;
            sectionEl.style.setProperty("--bg-mobile", `url("${new URL(src, document.baseURI).href}")`);
          }

          // Swap the bg for the current slide. The variant that isn't on screen (desktop vs
          // mobile) is swapped instantly so a resize still shows the right slide; the visible
          // one crossfades when enabled (bgFade on desktop, bgFadeMobile on mobile).
          function updateBg(animate = true) {
            if (!bgImg) return;
            const onMobile = mobileQuery.matches;
            const desktopSrc = bgImages[current];
            const mobileSrc = bgMobileImages[current];

            // Finish any fade still running before starting a new one
            if (fadeLayer) {
              fadeLayer.remove();
              fadeLayer = null;
            }

            if (onMobile) setDesktopBg(desktopSrc);
            else setMobileBg(mobileSrc);

            const src = onMobile ? mobileSrc : desktopSrc;
            const shown = onMobile ? bgMobileSource && bgMobileSource.getAttribute("srcset") : bgImg.getAttribute("src");
            const commit = onMobile ? () => setMobileBg(mobileSrc) : () => setDesktopBg(desktopSrc);
            if (!src || shown === src) return;
            if (!animate || !(onMobile ? bgFadeMobile : bgFade)) return commit();

            // Crossfade: fade a copy with the new image in on top, then swap the real bg
            const layer = bgImg.cloneNode();
            layer.removeAttribute("id");
            layer.classList.add("bg-fade-layer");
            layer.src = src;
            sectionEl.appendChild(layer);
            fadeLayer = layer;

            let finished = false;
            function finish() {
              if (finished || fadeLayer !== layer) return;
              finished = true;
              commit();
              // Let the real bg load/paint the new image before uncovering it
              const reveal = () => {
                if (fadeLayer !== layer) return;
                layer.remove();
                fadeLayer = null;
              };
              bgImg.addEventListener("load", reveal, { once: true });
              setTimeout(reveal, 300);
            }

            whenLoaded(layer, () => {
              if (fadeLayer !== layer) return;
              void layer.offsetWidth; // commit opacity: 0 so the transition runs
              layer.classList.add("is-visible");
              layer.addEventListener("transitionend", finish, { once: true });
              setTimeout(finish, BG_FADE_MS + 100); // in case transitionend never fires
            });
          }

          // Show the title image for the current slide (crossfades via .form-title CSS)
          function updateTitle() {
            titles.forEach((img, i) => img.classList.toggle("is-active", i === current));
          }

          function goToSlide(index, animate = true) {
            current = Math.max(0, Math.min(slideCount - 1, index));
            setTransform(current * -100, animate);
            updateArrows();
            updateBg(animate);
            updateTitle();
          }

          // Step one slide, but ignore it while the previous slide/bg animation is still
          // running — fast clicks would otherwise skip slides and cut the bg crossfade short.
          // Returns whether the slide changed.
          function changeSlide(step) {
            const target = Math.max(0, Math.min(slideCount - 1, current + step));
            const now = performance.now();
            if (target === current || fadeLayer || now < trackBusyUntil) return false;
            trackBusyUntil = now + 500;
            goToSlide(target);
            return true;
          }

          arrowLeft.addEventListener("click", () => changeSlide(-1));
          arrowRight.addEventListener("click", () => changeSlide(1));

          // Drag / swipe to slide (touch + mouse)
          let startX = 0;
          let isDragging = false;
          let dragOffsetPercent = 0;

          function dragStart(x) {
            startX = x;
            isDragging = true;
            trackWidth = sliderEl.offsetWidth;
          }

          function dragMove(x) {
            if (!isDragging) return;
            const deltaPx = x - startX;
            dragOffsetPercent = (deltaPx / trackWidth) * 100;
            setTransform(current * -100 + dragOffsetPercent, false);
          }

          function dragEnd() {
            if (!isDragging) return;
            isDragging = false;
            const threshold = 15; // percent of track width
            const step = dragOffsetPercent < -threshold ? 1 : dragOffsetPercent > threshold ? -1 : 0;
            // Too short a drag, or still animating → snap the track back (leave the bg alone,
            // so a tap on an arrow mid-fade doesn't restart the crossfade)
            if (!step || !changeSlide(step)) setTransform(current * -100);
            dragOffsetPercent = 0;
          }

          sliderEl.addEventListener("touchstart", (e) => dragStart(e.touches[0].clientX), { passive: true });
          sliderEl.addEventListener("touchmove", (e) => dragMove(e.touches[0].clientX), { passive: true });
          sliderEl.addEventListener("touchend", dragEnd);

          // Mouse drag is opt-out per slider (desktop arrows only)
          if (mouseDrag) {
            sliderEl.classList.add("is-draggable");
            sliderEl.addEventListener("mousedown", (e) => {
              e.preventDefault();
              dragStart(e.clientX);
            });
            window.addEventListener("mousemove", (e) => dragMove(e.clientX));
            window.addEventListener("mouseup", dragEnd);
          }

          goToSlide(0, false);
        }

        // Section 2
        initProductSlider({
          sliderId: "productSlider2",
          arrowLeftId: "sliderArrowLeft",
          arrowRightId: "sliderArrowRight",
          bgImgId: "section2Bg",
          mouseDrag: false,
          bgFade: true,
          titleId: "section2Title",
          bgImages: [
            "./assets/images/product/product-2-1.jpg",
            "./assets/images/product/product-2-2.jpg",
            "./assets/images/product/product-2-3.jpg",
          ],
          bgMobileSourceId: "section2BgMobile",
          bgFadeMobile: true,
          bgMobileImages: [
            "./assets/images/product/product-mobile-2-1.jpg",
            "./assets/images/product/product-mobile-2-2.jpg",
            "./assets/images/product/product-mobile-2-3.jpg",
          ],
        });

        // Section 3
        initProductSlider({
          sliderId: "productSlider3",
          arrowLeftId: "sliderArrowLeft3",
          arrowRightId: "sliderArrowRight3",
          bgImgId: "section3Bg",
          mouseDrag: false,
          bgFade: true,
          bgImages: [
            "./assets/images/product/product-3-1.jpg",
            "./assets/images/product/product-3-2.jpg",
            "./assets/images/product/product-3-3.jpg",
          ],
          bgMobileSourceId: "section3BgMobile",
          bgFadeMobile: true,
          bgMobileImages: [
            "./assets/images/product/product-mobile-3-1.jpg",
            "./assets/images/product/product-mobile-3-2.jpg",
            "./assets/images/product/product-mobile-3-3.jpg",
          ],
        });

        // Section 5
        initProductSlider({
          sliderId: "productSlider5",
          arrowLeftId: "sliderArrowLeft5",
          arrowRightId: "sliderArrowRight5",
          bgImgId: "section5Bg",
          mouseDrag: false,
          bgFade: true,
          bgImages: [
            "./assets/images/product/product-5-1.jpg",
            "./assets/images/product/product-5-2.jpg",
            "./assets/images/product/product-5-3.jpg",
          ],
          bgMobileSourceId: "section5BgMobile",
          bgFadeMobile: true,
          bgMobileImages: [
            "./assets/images/product/product-mobile-5-1.jpg",
            "./assets/images/product/product-mobile-5-2.jpg",
            "./assets/images/product/product-mobile-5-3.jpg",
          ],
        });

        // Section 6
        initProductSlider({
          sliderId: "productSlider6",
          arrowLeftId: "sliderArrowLeft6",
          arrowRightId: "sliderArrowRight6",
          bgImgId: "section6Bg",
          mouseDrag: false,
          bgFade: true,
          bgImages: [
            "./assets/images/product/product-6-1.jpg",
            "./assets/images/product/product-6-2.jpg",
            "./assets/images/product/product-6-3.jpg",
          ],
          bgMobileSourceId: "section6BgMobile",
          bgFadeMobile: true,
          bgMobileImages: [
            "./assets/images/product/product-mobile-6-1.jpg",
            "./assets/images/product/product-mobile-6-2.jpg",
            "./assets/images/product/product-mobile-6-3.jpg",
          ],
        });

        // Section 7
        initProductSlider({
          sliderId: "productSlider7",
          arrowLeftId: "sliderArrowLeft7",
          arrowRightId: "sliderArrowRight7",
        });
      });
    </script>
